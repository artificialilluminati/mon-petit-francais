<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Lab</title><style>
*{box-sizing:border-box}body{background:#fcf6e9;color:#191719;font-family:system-ui;margin:0}main{max-width:600px;margin:auto;padding:25px 18px 100px}h1{font-size:3rem;letter-spacing:-.06em;line-height:1}.panel{background:#fffefa;border-radius:28px;padding:22px;margin:20px 0}.question{background:#e6d5fa;border-radius:32px;padding:35px 20px;font-size:1.4rem;text-align:center;font-weight:750}button,select,input{font:inherit;border-radius:16px;padding:14px;border:1px solid #d6cfc4}button{background:#f7c3df;font-weight:bold;cursor:pointer}button.option{display:block;width:100%;margin:10px 0;text-align:left;background:#fff}button.option:nth-child(even){background:#fff1c9}.primary{background:#191719;color:white;width:100%;margin-top:12px}select,input{width:100%;margin:10px 0;background:white}.feedback{background:#dff0c8;border-radius:20px;padding:18px;margin-top:16px}.wrong{background:#ffe0e8}.hide{display:none}.nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#191719;padding:18px;border-radius:25px;width:min(94%,580px);text-align:center}.nav a{color:white;text-decoration:none;padding:10px}.nav a:last-child{background:#f7c3df;color:black;border-radius:14px}
</style></head><body><main><p>✦ A2 · Grammar Lab</p><h1>La grammaire,<br>sans panique.</h1><p>Choose the tense, conjugate the verb, and learn the rule when you make a mistake.</p><section class="panel"><label>Topic</label><select id="topic"><option value="all">Mix all tenses</option><option value="mistakes">Review mistakes</option></select><label>Mode</label><select id="mode"><option value="choice">Choose the correct form</option><option value="type">Type the French form</option><option value="tense">Identify the tense</option></select><button class="primary" id="start">Start practicing →</button></section><section class="panel hide" id="play"><p id="count"></p><div class="question" id="question"></div><p id="verb"></p><div id="options"></div><div id="typing" class="hide"><input id="answer" autocomplete="off" spellcheck="false" placeholder="Écris en français"><button class="primary" id="check">Check</button></div><div id="feedback" class="hide"></div><button id="next" class="primary hide">Next →</button></section><section class="panel"><h2>Grammar rules</h2><div id="rules"></div></section><p>40 original A2 questions. Progress stays on this device.</p></main><nav class="nav"><a href="../index.html">← Vocabulary</a><a href="./grammar.html">Grammar Lab</a></nav><script src="./grammar-data.js"></script><script>
const $=id=>document.getElementById(id),norm=s=>s.toLowerCase().trim().replace(/[’]/g,"'").normalize('NFC');let history={};try{history=JSON.parse(localStorage.getItem('mpf-grammar-v1')||'{}')}catch(e){}let queue=[],i=0,score=0,locked=false;
for(const tense of Object.keys(RULES)){let o=document.createElement('option');o.value=tense;o.textContent=tense;$('topic').append(o);let d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent=tense;p.textContent=RULES[tense];d.append(s,p);$('rules').append(d)}
const shuffle=a=>a.slice().sort(()=>Math.random()-.5);
$('start').onclick=()=>{const t=$('topic').value;queue=shuffle(QUESTIONS.map((q,j)=>({q,j})).filter(({q,j})=>t==='all'||(t==='mistakes'?history[j]?.wrong:q[3]===t))).slice(0,20);if(!queue.length){alert('No questions in this selection yet.');return}i=0;score=0;$('play').classList.remove('hide');render()};
function render(){locked=false;let q=queue[i].q,mode=$('mode').value;$('count').textContent=(i+1)+' / '+queue.length+' · '+score+' correct';$('question').textContent=q[0];$('verb').textContent='Infinitive: '+q[1];$('feedback').classList.add('hide');$('next').classList.add('hide');$('typing').classList.toggle('hide',mode!=='type');$('options').replaceChildren();$('answer').value='';if(mode!=='type'){let correct=mode==='tense'?q[3]:q[2],pool=mode==='tense'?Object.keys(RULES):QUESTIONS.map(x=>x[2]);let opts=shuffle([correct,...shuffle([...new Set(pool.filter(x=>x!==correct))]).slice(0,3)]);for(let v of opts){let b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>grade(v);$('options').append(b)}}}
function grade(v){if(locked)return;locked=true;let {q,j}=queue[i],correct=$('mode').value==='tense'?q[3]:q[2],ok=norm(v)===norm(correct);if(ok)score++;let h=history[j]||{wrong:0};h.wrong=ok?0:h.wrong+1;history[j]=h;localStorage.setItem('mpf-grammar-v1',JSON.stringify(history));let f=$('feedback');f.className='feedback'+(ok?'':' wrong');f.replaceChildren();for(let s of [ok?'Bien joué !':'Review this rule:', 'Correct answer: '+correct,'Tense: '+q[3],RULES[q[3]]]){let p=document.createElement('p');p.textContent=s;f.append(p)}$('typing').classList.add('hide');for(let b of $('options').children)b.disabled=true;$('next').classList.remove('hide')}
$('check').onclick=()=>{if($('answer').value.trim())grade($('answer').value)};$('answer').onkeydown=e=>{if(e.key==='Enter')$('check').click()};$('next').onclick=()=>{i++;if(i===queue.length){$('question').textContent='Bravo ! '+score+' / '+queue.length;$('options').replaceChildren();$('feedback').classList.add('hide');$('next').classList.add('hide');return}render()};
</script></body></html>
